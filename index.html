<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>품질관리 통합포털</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- [1] 랜딩 페이지 -->
<div id="landingScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box;">
    <div style="background-color: #0b132b; padding: 30px 25px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
        
        <div class="landing-title-name" style="font-size: 24px; font-weight: bold; color: #38bdf8; margin-bottom: 5px;">Xshatriya</div>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">먼저 로그인하세요</p>
        
        <div id="loginStatusMsg" style="display: none; margin-bottom: 15px; color: #34d399; font-size: 13px; font-weight: bold; background: rgba(52, 211, 153, 0.1); padding: 8px 12px; border-radius: 6px; width: 100%; text-align: center;">✔ 구글 계정 연동 완료</div>

        <button id="landingGoogleBtn" onclick="triggerGoogleLogin()" style="background: #fff; color: #333; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.8 2.71v2.26h2.91c1.7-1.56 2.69-3.86 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.85.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.95v2.33C2.43 15.75 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.52 0 9s.35 2.85.95 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.43 2.25.95 4.96l3.01 2.33c.71-2.13 2.7-3.71 5.04-3.71z"/></svg>
            구글 계정으로 로그인
        </button>

        <div style="display: flex; gap: 8px; width: 100%; margin-bottom: 8px;">
            <button id="landingImportBtn" onclick="importAllFromDrive()" style="background-color: #10b981; color: white; flex: 1; display: none; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">IMPORT</button>
            <button id="landingSyncBtn" onclick="syncAllToDrive()" style="background-color: #10b981; color: white; flex: 1; display: none; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">EXPORT</button>
        </div>
        <button id="landingEnterBtn" onclick="enterPortal()" style="background-color: #10b981; color: white; display: none; width: 100%; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">HOME</button>
    </div>
</div>

<!-- [2] 포털 본문 껍데기 -->
<div id="portalContent" style="display: none; background-color: #f1f5f9; min-height: 100vh;">
    <header class="global-header">
        <div class="header-left-group">
            <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
            <span class="header-title" onclick="goToLandingScreen()" style="cursor: pointer;">화성ENG(주)</span>
        </div>
        <nav class="nav-menu" id="navMenu">
            <button class="nav-btn btn-home active" onclick="switchTab('home', this)">🏠 Home</button>
            <button class="nav-btn btn-schedule" onclick="switchTab('schedule', this)">📅 스케줄</button>
            <button class="nav-btn btn-board" onclick="switchTab('board', this)">📌 게시판</button>
            <button class="nav-btn btn-nonconformity" onclick="switchTab('nonconformity', this)">⚠️ 부적합</button>
            <button class="nav-btn btn-contacts" onclick="switchTab('contacts', this)">📞 연락처</button>
            <button class="nav-btn btn-specifications" onclick="switchTab('specifications', this)">📁 파일</button>
            <button class="nav-btn btn-autocad" onclick="switchTab('autocad', this)">💡 TIP</button>
            <button class="nav-btn btn-memo" onclick="switchTab('memo', this)">📝 메모</button>
            <button class="nav-btn btn-calculator" onclick="switchTab('calculator', this)">🧮 계산기</button>
        </nav>
        <div class="header-right-group">
            <button onclick="logoutToLanding()" style="background:#ef4444; color:white; padding:4px 8px; border:none; border-radius:4px; font-size:11px; cursor:pointer;">🔒 잠금/로그아웃</button>
        </div>
    </header>
    <div class="container">
        <div class="content-body">
            <div id="tab-home" class="tab-content active">
                <div class="hero-banner"><h2>품질관리 데스크</h2></div>
            </div>
            <!-- 다른 탭 내용들은 기존에 쓰시던 탭 구조를 그대로 두시면 됩니다 -->
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
