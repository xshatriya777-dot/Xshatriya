<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>품질관리 통합포털</title>
    <!-- 외부 라이브러리 및 파일 연결 -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- [1] 랜딩 페이지 -->
<div id="landingScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px;">
    <div class="landing-title-name">Xshatriya</div>
    <p>먼저 로그인하세요</p>
    
    <div id="loginStatusMsg" class="login-status-box" style="display: none; margin-bottom: 10px; color: #10b981; font-weight: bold;">✔ 구글 계정 연동 완료</div>

    <button id="landingGoogleBtn" onclick="triggerGoogleLogin()" class="landing-btn btn-google-custom" style="margin-bottom: 10px;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.8 2.71v2.26h2.91c1.7-1.56 2.69-3.86 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.85.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.95v2.33C2.43 15.75 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.52 0 9s.35 2.85.95 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.43 2.25.95 4.96l3.01 2.33c.71-2.13 2.7-3.71 5.04-3.71z"/></svg>
        구글 계정으로 로그인
    </button>

    <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 12px;">
        <!-- IMPORT 버튼 -->
        <button id="landingImportBtn" class="landing-btn" onclick="importAllFromDrive()" 
                style="background-color: #10b981; color: white; flex: 1; display: none; margin-bottom: 0; border: none; padding: 12px; cursor: pointer; transition: 0.2s; border-radius: 6px;"
                onmouseover="this.style.backgroundColor='#059669'" 
                onmouseout="this.style.backgroundColor='#10b981'"
                onmousedown="this.style.transform='scale(0.95)'"
                onmouseup="this.style.transform='scale(1)'">IMPORT</button>
        
        <!-- EXPORT 버튼 -->
        <button id="landingSyncBtn" class="landing-btn" onclick="syncAllToDrive()" 
                style="background-color: #10b981; color: white; flex: 1; display: none; margin-bottom: 0; border: none; padding: 12px; cursor: pointer; transition: 0.2s; border-radius: 6px;"
                onmouseover="this.style.backgroundColor='#059669'" 
                onmouseout="this.style.backgroundColor='#10b981'"
                onmousedown="this.style.transform='scale(0.95)'"
                onmouseup="this.style.transform='scale(1)'">EXPORT</button>
    </div>

    <!-- HOME 버튼 -->
    <button id="landingEnterBtn" onclick="enterPortal()" class="landing-btn" 
            style="background-color: #10b981; color: white; display: none; width: 100%; border: none; padding: 12px; cursor: pointer; transition: 0.2s; border-radius: 6px; margin-bottom: 10px;"
            onmouseover="this.style.backgroundColor='#059669'" 
            onmouseout="this.style.backgroundColor='#10b981'"
            onmousedown="this.style.transform='scale(0.95)'"
            onmouseup="this.style.transform='scale(1)'">HOME</button>
</div>

<!-- [2] 실제 포털 본문 -->
<div id="portalContent" style="display: none;">
    <header class="global-header">
        <div class="header-left-group">
            <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
            <span class="header-title" onclick="goToLandingScreen()" style="cursor: pointer;" title="랜딩 페이지로 돌아가기">화성ENG(주)</span>
        </div>
        <nav class="nav-menu" id="navMenu">
            <button class="nav-btn btn-home active" onclick="switchTab('home', this)">🏠 Home</button>
            <button class="nav-btn btn-schedule" onclick="switchTab('schedule', this)">📅 스케줄</button>
            <button class="nav-btn btn-board" onclick="switchTab('board', this)">📌 게시판</button>
            <button class="nav-btn btn-nonconformity" onclick="switchTab('nonconformity', this)">⚠️ 부적합</button>
            <button class="nav-btn btn-contacts" onclick="switchTab('contacts', this)">📞 연락처</button>
            <button class="nav-btn btn-specifications" onclick="switchTab('specifications', this)">📁 파일</button>
            <button class="nav-btn btn-autocad" onclick="switchTab('autocad', this)">💡 TIP</button>
            <button class="nav-btn btn-memo" onclick="switchTab('memo', this)">📝 메모</button>
            <button class="nav-btn btn-calculator" onclick="switchTab('calculator', this)">🧮 계산기</button>
            <div class="right-link-group">
                <a href="https://stsds.secsso.net/adfs/ls/..." target="_blank" class="nav-btn nav-btn-cpms">🏢 CPMS</a>
                <a href="https://mail.daum.net" target="_blank" class="nav-btn nav-btn-daum">✉️ MAIL</a>
            </div>
        </nav>
        <div class="header-right-group">
            <button onclick="logoutToLanding()" class="action-btn" style="background:#ef4444; color:white; padding:4px 8px; font-size:11px;">🔒 잠금/로그아웃</button>
        </div>
    </header>

    <div class="container">
        <div class="content-body">
            <!-- (본문 내용 생략 - 기존 코드와 동일) -->
        </div>
    </div>
</div>

<script>
    // 로그인 상태라면 페이지 열릴 때 버튼 바로 보여주기
    if (localStorage.getItem('quality_access_token')) {
        document.getElementById('landingGoogleBtn').style.display = 'none';
        document.getElementById('loginStatusMsg').style.display = 'block';
        document.getElementById('landingImportBtn').style.display = 'flex';
        document.getElementById('landingSyncBtn').style.display = 'flex';
        document.getElementById('landingEnterBtn').style.display = 'flex';
    }
</script>
<script src="script.js"></script>
</body>
</html>
